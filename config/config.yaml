env: dev

log:
  level: debug

service:
  port: 8080
  # proxies / load balancers whose X-Forwarded-For is trusted (IPs or CIDRs);
  # empty = use the connection address. Set this behind a load balancer, or every
  # request looks like it comes from the balancer and shares one login limit.
  trustedProxies: []

db:
  sql:
    db: template7
    host: 127.0.0.1
    port: 33306
    username: admin
    password: ""
    connection:
      min: 4
      max: 8

cache:
  host: "localhost:36379"
  password: ""

auth:
  rbacModelPath: "./config/rbac_model.conf"
  jwtSecret: "" # set via T7_AUTH_JWTSECRET (min 32 chars)
  login:
    maxFailuresPerUser: 5
    maxFailuresPerIp: 20
    windowMinutes: 15
